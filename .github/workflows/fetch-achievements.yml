name: Fetch Achievements

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6am UTC
  workflow_dispatch: # Manual trigger
    inputs:
      # Only needed when shards exist but are stale in a way the
      # unchanged/staggered-refresh checks won't catch — a shard format
      # change, or wanting rarity current before the 7-day cycle.
      force_refresh:
        description: 'Re-pull every trophy list (slow)'
        type: boolean
        default: false

permissions:
  # Read-only now: the run's output goes to R2, not to a branch. The
  # only thing it still writes to GitHub is an issue when auth breaks.
  contents: read
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (scripts)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # The previous run's state — achievements.json, every shard, the
      # tint cache, the re-hosted Xbox icons — plus games.json and the
      # overrides the app publishes. This used to be a checkout of the
      # `data` branch; the data now lives in R2, which is a store built
      # for blobs rather than a git history recording 3,000 versions of
      # them.
      #
      # Fails the job if it can't complete. That's deliberate: every
      # step below reads this tree, and a partial pull would look
      # exactly like games having been deleted.
      - name: Pull data from R2
        run: node scripts/r2-pull.mjs data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Persist PSN / Xbox refresh tokens between runs so NPSSO / password
      # auth only needs to happen rarely. The cache key rotates weekly so
      # a stale token doesn't wedge runs forever.
      - name: Restore auth token cache
        id: token-cache
        uses: actions/cache@v4
        with:
          path: ~/.game-list
          key: achievement-tokens-${{ github.run_number }}
          restore-keys: |
            achievement-tokens-

      - name: Fetch achievement data
        run: node scripts/fetch-achievements.mjs
        env:
          DATA_DIR: ${{ github.workspace }}/public/data
          TOKEN_DIR: /home/runner/.game-list
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
          PSN_NPSSO_TOKEN: ${{ secrets.PSN_NPSSO_TOKEN }}
          XBOX_REFRESH_TOKEN: ${{ secrets.XBOX_REFRESH_TOKEN }}
          XBOX_EMAIL: ${{ secrets.XBOX_EMAIL }}
          XBOX_PASSWORD: ${{ secrets.XBOX_PASSWORD }}
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          RA_USERNAME: ${{ secrets.RA_USERNAME }}
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '0' }}

      # FFXIV scrapes the Lodestone directly — no auth, just the
      # character ID (which is public anyway, but kept as a secret
      # for parity with the other env vars). The script merges its
      # `ffxiv` slice into the same achievements.json the previous
      # step just wrote, preserving the steam/psn/xbox slices.
      # Non-fatal on purpose. The script now exits non-zero rather than
      # writing an undercounted total when a category fails to scrape, and
      # without this that would take the whole run down with it — skipping
      # the leaderboard, the timeline and the commit, so a Lodestone hiccup
      # would throw away the Steam/PSN/Xbox data the previous step just
      # fetched. Safe to skip because fetch-achievements.mjs carries the
      # existing `ffxiv` slice forward instead of rebuilding without it, so
      # a failed scrape leaves yesterday's FFXIV numbers in place rather
      # than deleting them. The step still shows as failed on the run.
      - name: Fetch FFXIV achievements (Lodestone)
        continue-on-error: true
        run: node scripts/fetch-ffxiv-lodestone.mjs
        env:
          DATA_DIR: ${{ github.workspace }}/public/data
          FFXIV_LODESTONE_ID: ${{ secrets.FFXIV_LODESTONE_ID }}

      # Reads achievements.json + every shard (not just what this run
      # touched) to (re)build the score/rarity leaderboard, so a stale
      # shard from an earlier run still counts.
      # sharp is deliberately not a tracked dependency and the postinstall
      # hook opts out on CI entirely, because its per-platform native
      # packages break `npm ci` on the Linux runner (see
      # scripts/lib/load-sharp.mjs). The leaderboard's cover tints need it,
      # though, and without it every nightly run published a leaderboard
      # with no tints at all while degrading silently.
      #
      # --no-save keeps the lockfile untouched, so `npm ci` above is
      # unaffected and the deploy workflow's install stays platform-neutral.
      # Non-fatal on purpose: if this ever fails, the build still produces a
      # correct leaderboard, just without tints.
      - name: Install sharp for cover tints
        continue-on-error: true
        run: npm install --no-save sharp

      - name: Build leaderboard
        run: node scripts/build-leaderboard.mjs
        env:
          DATA_DIR: ${{ github.workspace }}/public/data

      - name: Build timeline
        run: node scripts/build-timeline.mjs
        env:
          DATA_DIR: ${{ github.workspace }}/public/data

      # Push the run's output back to the bucket the site reads from.
      #
      # Scoped with --only to exactly what this workflow produces. The
      # tree also holds games.json, covers.json and overrides/, which the
      # app's publish path writes directly to R2 — syncing those back
      # would overwrite a publish that landed after the pull, which is
      # the race the old data-branch step needed pull --rebase to
      # survive. Not touching them removes it instead.
      #
      # --prune so a delisted game's shard is deleted rather than left
      # behind. r2-sync refuses a prune that would remove an
      # implausible share of the bucket, so a short pull can't cascade
      # into a mass delete.
      - name: Sync data to R2
        run: |
          node scripts/r2-sync.mjs data --prune \
            --only=achievements.json,platform-libraries.json,leaderboard.json,timeline.json,cover-tints.json,achievements,xbox-icons
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # ── PSN NPSSO renewal alert ──
      # The fetch script writes ~/.game-list/psn-status=expired when PSN auth
      # fails (usually because the NPSSO token hit its ~60-day lifetime). We
      # open a GitHub issue with renewal instructions so the owner gets an
      # email via standard notifications — no SMTP setup required.
      - name: Check PSN auth status
        id: psn-status
        run: |
          if [ -f ~/.game-list/psn-status ] && [ "$(cat ~/.game-list/psn-status)" = "expired" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if PSN NPSSO expired
        if: steps.psn-status.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure the label exists (idempotent).
          gh label create psn-token-expired \
            --color B60205 \
            --description "PSN NPSSO needs refresh" \
            2>/dev/null || true

          # Skip if an open issue already exists — avoids daily spam until
          # the owner acts on the first one.
          existing=$(gh issue list \
            --label psn-token-expired \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, skipping"
            exit 0
          fi

          # Heredoc body: quoted EOF → no expansion, backticks are literal.
          # YAML block scalar strips 10 leading spaces from each line below.
          body=$(cat <<'EOF'
          The daily achievement fetch hit a PSN auth failure. This usually
          means the **NPSSO token** stored in the `PSN_NPSSO_TOKEN` repo
          secret has hit its ~60-day lifetime and needs to be refreshed.

          ## How to refresh it

          1. Open a browser and log in to <https://www.playstation.com> with
             your PSN account.
          2. In the **same session**, visit
             <https://ca.account.sony.com/api/v1/ssocookie>
          3. Copy the `npsso` value from the JSON response — just the
             ~64-character string, not the whole blob.
          4. Update the repo secret:
             **Settings → Secrets and variables → Actions →
             `PSN_NPSSO_TOKEN` → Update secret**
          5. Re-run the failing workflow from the **Actions** tab
             (or wait for tomorrow's cron to pick it up).
          6. Close this issue once the next run succeeds.

          ## Gotchas

          - Must be a logged-in browser session — incognito only works if
            you log in there first.
          - `{"npsso":null}` in the JSON response means you're not logged
            in; go back to step 1.
          - The workflow's refresh-token cache extends the token's useful
            life between runs but can't survive an NPSSO expiration.
          EOF
          )

          gh issue create \
            --label psn-token-expired \
            --title "PSN NPSSO token expired — renewal needed" \
            --body "$body"

      # ── Xbox refresh-token renewal alert ──
      # Xbox tokens don't expire on a clock — as long as something uses
      # them inside any 90-day window they keep auto-rotating — but they
      # can still break (MS account password change, Microsoft-side
      # security revocation, suspicious-activity lockout). When that
      # happens the script writes ~/.game-list/xbox-status=expired and
      # we open an issue pointing at the device-code helper.
      - name: Check Xbox auth status
        id: xbox-status
        run: |
          if [ -f ~/.game-list/xbox-status ] && [ "$(cat ~/.game-list/xbox-status)" = "expired" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if Xbox refresh token invalidated
        if: steps.xbox-status.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create xbox-token-expired \
            --color B60205 \
            --description "Xbox refresh token needs re-minting" \
            2>/dev/null || true

          existing=$(gh issue list \
            --label xbox-token-expired \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, skipping"
            exit 0
          fi

          body=$(cat <<'EOF'
          The daily achievement fetch hit an Xbox Live auth failure. Unlike
          PSN, Xbox refresh tokens don't expire on a clock — as long as the
          workflow runs at least once every 90 days, the token auto-rotates
          indefinitely. So this failure probably means one of:

          - The Microsoft account password was changed (invalidates all
            existing refresh tokens).
          - Microsoft's security system revoked the token (new-device
            login, unusual activity, policy change, etc.).
          - The account was manually signed out from the Microsoft account
            security page.

          ## How to re-mint

          Run the helper script locally:

              npm run xbox-get-refresh-token

          It will:

          1. Print a short code and a URL (`https://www.microsoft.com/link`).
          2. You go to the URL in any browser, enter the code, sign in
             with the Microsoft account tied to your Xbox, and approve.
             2FA works normally — it's the real Microsoft login page.
          3. The script writes the new refresh token to
             `~/.game-list/xbox-refresh-token` (mode 600) and copies it
             to your clipboard via `pbcopy` — it never prints the value
             to stdout.

          Then:

          1. Update the repo secret:
             **Settings → Secrets and variables → Actions →
             `XBOX_REFRESH_TOKEN` → Update secret** → ⌘V.
          2. Re-run the failing workflow from the **Actions** tab (or
             wait for tomorrow's cron).
          3. Close this issue once the next run succeeds.

          ## Background

          The helper uses Microsoft's v1 Live Connect limited-input-device
          flow with the Minecraft launcher's public client ID — the same
          path `prismarine-auth` and most open-source Xbox Live tooling
          uses. The old redirect flow is blocked by Microsoft's
          anti-phishing page, and the v2.0 Microsoft Identity Platform
          device-code endpoint rejects both first-party and legacy public
          clients for Xbox Live scopes, so v1 is the only path that
          currently works without registering a custom Azure app.
          EOF
          )

          gh issue create \
            --label xbox-token-expired \
            --title "Xbox refresh token invalidated — renewal needed" \
            --body "$body"

      # ── Stuck Xbox bootstrap totals ──
      # titleHub reports totalAchievements:0 for current-gen titles, so a
      # newly-seen Xbox game is recorded with a placeholder total equal to
      # its earned count (i.e. reads as 100% complete) until the post-sync
      # pass corrects it from the fetched achievement list. If that pass
      # can't run — no shard on disk to read — the placeholder sticks, and
      # it does NOT resolve later: the next run takes that number back in
      # as `priorTotal` and can't tell it from a real total. The script
      # writes the affected titles to ~/.game-list/, and we raise an issue
      # rather than leave it to be spotted in a log nobody reads nightly.
      - name: Check for stuck Xbox bootstrap totals
        id: xbox-bootstrap
        run: |
          if [ -s ~/.game-list/xbox-bootstrap-stuck ]; then
            echo "stuck=true" >> "$GITHUB_OUTPUT"
            {
              echo 'titles<<TITLES_EOF'
              cat ~/.game-list/xbox-bootstrap-stuck
              echo 'TITLES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if Xbox totals are stuck
        if: steps.xbox-bootstrap.outputs.stuck == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLES: ${{ steps.xbox-bootstrap.outputs.titles }}
        run: |
          gh label create xbox-total-stuck \
            --color D93F0B \
            --description "Xbox title stuck on a placeholder achievement total" \
            2>/dev/null || true

          existing=$(gh issue list \
            --label xbox-total-stuck \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "Issue #$existing already open, skipping"
            exit 0
          fi

          # Heredoc straight to a file, then --body-file. Deliberately NOT
          # body=$(cat <<'EOF' ...): a heredoc nested inside command
          # substitution mis-parses on any apostrophe in the body, so a
          # single "can't" silently breaks the whole step. Writing the file
          # first avoids the nesting and works on every bash.
          cat > /tmp/issue-body.md <<'EOF'
          The daily achievement fetch finished, but one or more Xbox titles
          are still recorded with a **placeholder achievement total** rather
          than their real one.

          Affected titles (recorded earned/total):

          ```
          {{TITLES}}
          ```

          ## What this means

          Xbox's titleHub API returns `totalAchievements: 0` for current-gen
          titles, so the first time a game is seen its total is bootstrapped
          to its earned count — which makes it read as **100% complete**. A
          post-sync pass corrects that from the downloaded achievement list.

          These titles never got corrected, which means the pass found no
          achievement shard on disk to correct from. That state does not fix
          itself: the next run reads the placeholder back as `priorTotal`
          and can't tell it from a genuine total.

          ## Likely symptoms

          - The game shows as 100% complete when it isn't.
          - The game is missing from the leaderboard, or ranked wrongly.
          - Once you earn another achievement, earned exceeds total.

          ## How to investigate

          1. Check the run log for a line like
             `xbox: N list(s) disagreed with the library counts and were not written`
             — that means the shard write was refused.
          2. Look for the title's shard under
             `public/data/achievements/xbox/<titleId>.json` on the `data`
             branch. If it's absent, the fetch never produced a usable list.
          3. Re-running the workflow with **force_refresh** re-pulls every
             list and will repair the title if the underlying fetch now
             succeeds.
          4. Close this issue once the next run reports the title corrected.
          EOF

          # Substitute the title list into the placeholder. python3 rather
          # than sed: the titles contain slashes (19/57) and em dashes, and
          # this needs no escaping of either.
          TITLES="$TITLES" python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('/tmp/issue-body.md')
          p.write_text(p.read_text().replace('{{TITLES}}', os.environ['TITLES']))
          PY

          gh issue create \
            --label xbox-total-stuck \
            --title "Xbox achievement totals stuck on placeholder values" \
            --body-file /tmp/issue-body.md
